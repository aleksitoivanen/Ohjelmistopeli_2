<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="Mummon esinepeli">
  <title>Mummon esinepeli</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Mummon esinepeli</h1>

  <div class="aloituslaatikko">
    <input id="nimi" type="text" placeholder="Pelaajan nimi">

    <select id="difficulty">
      <option value="HELPPO">Helppo</option>
      <option value="KESKIVAIKEA">Keskivaikea</option>
      <option value="VAIKEA">Vaikea</option>
    </select>

    <button onclick="aloitaPeli()">Aloita peli</button>
  </div>

  <div class="peli-layout">
  <!--aleksin ja laurin-->
   <div class="kartta-container">
  <img src="kartta.jpg" class="kartta" alt="Euroopan kartta">
  <button class="maa-nappi" style="left: 28px; top: 174px;" onclick="lenna('IS')" title="Islanti"></button>
  <button class="maa-nappi" style="left: 469px; top: 329px;" onclick="lenna('NO')" title="Norja"></button>
  <button class="maa-nappi" style="left: 580px; top: 347px;" onclick="lenna('SE')" title="Ruotsi"></button>
  <button class="maa-nappi" style="left: 687px; top: 325px;" onclick="lenna('FI')" title="Suomi"></button>
  <button class="maa-nappi" style="left: 473px; top: 437px;" onclick="lenna('DK')" title="Tanska"></button>
  <button class="maa-nappi" style="left: 153px; top: 498px;" onclick="lenna('IE')" title="Irlanti"></button>
  <button class="maa-nappi" style="left: 244px; top: 553px;" onclick="lenna('GB')" title="Yhdistynyt kuningaskunta"></button>
  <button class="maa-nappi" style="left: 6px; top: 891px;" onclick="lenna('PT')" title="Portugali"></button>
  <button class="maa-nappi" style="left: 116px; top: 848px;" onclick="lenna('ES')" title="Espanja"></button>
  <button class="maa-nappi" style="left: 269px; top: 631px;" onclick="lenna('FR')" title="Ranska"></button>
  <button class="maa-nappi" style="left: 333px; top: 538px;" onclick="lenna('NL')" title="Alankomaat"></button>
  <button class="maa-nappi" style="left: 316px; top: 578px;" onclick="lenna('BE')" title="Belgia"></button>
  <button class="maa-nappi" style="left: 340px; top: 609px;" onclick="lenna('LU')" title="Luxemburg"></button>
  <button class="maa-nappi" style="left: 479px; top: 532px;" onclick="lenna('DE')" title="Saksa"></button>
  <button class="maa-nappi" style="left: 350px; top: 687px;" onclick="lenna('CH')" title="Sveitsi"></button>
  <button class="maa-nappi" style="left: 482px; top: 601px;" onclick="lenna('CZ')" title="Tšekki"></button>
  <button class="maa-nappi" style="left: 510px; top: 654px;" onclick="lenna('AT')" title="Itävalta"></button>
  <button class="maa-nappi" style="left: 526px; top: 655px;" onclick="lenna('SK')" title="Slovakia"></button>
  <button class="maa-nappi" style="left: 554px; top: 683px;" onclick="lenna('HU')" title="Unkari"></button>
  <button class="maa-nappi" style="left: 604px; top: 546px;" onclick="lenna('PL')" title="Puola"></button>
  <button class="maa-nappi" style="left: 682px; top: 351px;" onclick="lenna('EE')" title="Viro"></button>
  <button class="maa-nappi" style="left: 667px; top: 420px;" onclick="lenna('LV')" title="Latvia"></button>
  <button class="maa-nappi" style="left: 683px; top: 479px;" onclick="lenna('LT')" title="Liettua"></button>
  <button class="maa-nappi" style="left: 719px; top: 500px;" onclick="lenna('BY')" title="Valko-Venäjä"></button>
  <button class="maa-nappi" style="left: 882px; top: 450px;" onclick="lenna('RU')" title="Venäjä"></button>
  <button class="maa-nappi" style="left: 418px; top: 821px;" onclick="lenna('IT')" title="Italia"></button>

  <button class="maa-nappi" style="left: 569px; top: 753px;" onclick="lenna('RS')" title="Serbia"></button>
  <button class="maa-nappi" style="left: 553px; top: 841px;" onclick="lenna('AL')" title="Albania"></button>
  <button class="maa-nappi" style="left: 585px; top: 824px;" onclick="lenna('MK')" title="Pohjois-Makedonia"></button>

</div>

    <div class="oikea-palsta">
      <div class="tilalaatikko">
        <p id="info">Aloita peli ensin.</p>
        <p id="hint"></p>
      </div>


    </div>

  </div>


  <!--aleksin-->
  <div id="blackjack-container" class="overlay">
    <h2>Blackjack-haaste</h2>

    <p id="bj-progress">Voitot: 0 / 5</p>

    <div id="bj-dealer" class="bj-kasi"></div>
    <div id="bj-player" class="bj-kasi"></div>

    <p id="bj-info"></p>

    <div class="pelinapit">
      <button id="bj-hit" onclick="bjHit()">Ota kortti</button>
      <button id="bj-stand" onclick="bjStand()">Jää</button>
      <button id="bj-uusi" onclick="bjUusi()">Uusi kierros</button>
    </div>
  </div>

  <!--aleksin-->
  <div id="matikka-container" class="overlay">
    <h2>Matikkahaaste</h2>

    <p id="matikka-progress">Oikein: 0 / 5</p>
    <p id="matikka-ajastin">Aikaa: 10</p>

    <div id="matikka-kysymys" class="matikka-kysymys"></div>

    <input id="matikka-vastaus" type="number" step="any" placeholder="Kirjoita vastaus">

    <div class="pelinapit">
      <button onclick="matikkaVastaa()">Vastaa</button>
    </div>

    <p id="matikka-info"></p>
  </div>
  <!--pietarin-->
<div id="heppa-container" class="overlay">
  <h2>Heppakisa</h2>
  <p class="heppa-ohje">Valitse hevonen. Jos hevosesi tulee ensimmäisenä maaliin, voitat.</p>

  <div id="heppa-valinnat" class="heppa-valinnat">
    <button class="heppa-valinta-nappi" onclick="valitseHevonen('Hevonen 1')">1</button>
    <button class="heppa-valinta-nappi" onclick="valitseHevonen('Hevonen 2')">2</button>
    <button class="heppa-valinta-nappi" onclick="valitseHevonen('Hevonen 3')">3</button>
  </div>

  <button id="heppa-aloita" class="heppa-paanappi" onclick="aloitaHeppakisa()" disabled>Aloita kisa</button>

  <div id="heppa-rata-alue" class="heppa-rata-alue" style="display:none;">
    <div id="heppa-radat"></div>
    <button id="heppa-liiku" class="heppa-paanappi" onclick="liikutaHepat()">Liiku</button>
    <button id="heppa-uusi" class="heppa-paanappi" onclick="avaaHeppakisa()" style="display:none;">Yritä uudestaan</button>
    <h3 id="heppa-tulos"></h3>
  </div>

  <audio id="hirnahdus" src="hirnahdus.mp3"></audio>

</div>
  <!--aleksin-->
  <div id="lento-overlay" class="lento-overlay">
    <div class="lento-sisalto">
      <h2>Lennetään...</h2>
      <img src="lentokone.gif" id="lento-gif" alt="Lentokone">
    </div>
  </div>
  <!--laurin-->
  <div id="tarina-overlay" class="tarina-overlay">
  <div class="tarina-sisalto">
    <button class="tarina-sulje" onclick="suljeTarina()">Sulje</button>
    <h2 id="tarina-otsikko"></h2>
    <img id="tarina-kuva" src="" alt="Löydetyn esineen kuva">
    <p id="tarina-teksti"></p>
  </div>
</div>
<audio id="bj-voitto-aanet" src="voitto.mp3"></audio>
  <script src="script.js"></script>
</body>
</html>
